<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Free online Notepad tool. Runs entirely in your browser — no uploads, no sign-up."><title>Notepad — TML Tools</title>
<style>body{font-family:-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:#04070C;color:#F4F8FF;margin:0;padding:24px}.wrap{max-width:900px;margin:0 auto}textarea{width:100%;min-height:400px;background:#0b121c;color:#F4F8FF;border:1px solid rgba(255,255,255,.14);border-radius:12px;padding:14px;font-size:14px}button{background:#37E0FF;color:#04121A;border:none;border-radius:8px;padding:8px 14px;font-weight:700;cursor:pointer;margin:6px 6px 6px 0}a{color:#37E0FF}p{color:#A9BBD4}</style></head>
<body><div class="wrap"><p><a href="index.html">← Tools</a></p><h1>Notepad</h1><p>Saved in your browser (localStorage). Nothing uploaded.</p><div style="margin:10px 0"><button onclick="save()">Save</button><button onclick="clearN()">Clear</button><button onclick="dl()">Download .txt</button></div><textarea id="n"></textarea></div>
<script>
const t=document.getElementById('n');t.value=localStorage.getItem('tml_notepad')||'';
function save(){localStorage.setItem('tml_notepad',t.value);}
function clearN(){if(confirm('Clear?')){t.value='';localStorage.removeItem('tml_notepad');}}
function dl(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([t.value],{type:'text/plain'}));a.download='notes.txt';a.click();}
setInterval(save,5000);
</script></body></html>
