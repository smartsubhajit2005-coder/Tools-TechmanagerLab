<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Free online Timestamp Converter tool. Runs entirely in your browser — no uploads, no sign-up."><title>Timestamp Converter — TML Tools</title>
<style>body{font-family:-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:#04070C;color:#F4F8FF;margin:0;padding:24px}.wrap{max-width:700px;margin:0 auto}input,select{background:#0b121c;color:#F4F8FF;border:1px solid rgba(255,255,255,.14);border-radius:8px;padding:8px 12px;font-size:14px}button{background:#37E0FF;color:#04121A;border:none;border-radius:8px;padding:8px 14px;font-weight:700;cursor:pointer;margin-left:8px}.out{margin-top:14px;background:rgba(9,14,22,.6);border:1px solid rgba(255,255,255,.14);border-radius:12px;padding:14px;font-family:monospace;font-size:13px;line-height:1.7}a{color:#37E0FF}</style></head>
<body><div class="wrap"><p><a href="index.html">← Tools</a></p><h1>Timestamp Converter</h1><input id="ts" placeholder="Unix timestamp or date string"><button onclick="conv()">Convert</button><div class="out" id="out"></div></div>
<script>
function conv(){const v=document.getElementById('ts').value.trim();const out=document.getElementById('out');let d;if(/^\d+$/.test(v)){const n=+v; d=new Date(v.length>10?n:n*1000);}else d=new Date(v);if(isNaN(d.getTime())){out.textContent='Invalid input';return;}out.innerHTML='UTC: '+d.toUTCString()+'<br>Local: '+d.toString()+'<br>ISO: '+d.toISOString()+'<br>Unix (s): '+Math.floor(d.getTime()/1000)+'<br>Unix (ms): '+d.getTime();}
</script></body></html>
