<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Free online Regex Tester tool. Runs entirely in your browser — no uploads, no sign-up."><title>Regex Tester — TML Tools</title>
<style>body{font-family:-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:#04070C;color:#F4F8FF;margin:0;padding:24px}.wrap{max-width:900px;margin:0 auto}input,textarea{width:100%;background:#0b121c;color:#F4F8FF;border:1px solid rgba(255,255,255,.14);border-radius:8px;padding:10px 12px;font-family:monospace;font-size:13px;margin-bottom:10px}textarea{min-height:160px}button{background:#37E0FF;color:#04121A;border:none;border-radius:8px;padding:8px 14px;font-weight:700;cursor:pointer;margin-right:6px}.out{margin-top:12px;background:#0b121c;border:1px solid rgba(255,255,255,.14);border-radius:12px;padding:14px;font-family:monospace;font-size:13px;line-height:1.7;white-space:pre-wrap}a{color:#37E0FF}.err{color:#ff6b6b}</style></head>
<body><div class="wrap"><p><a href="index.html">← Tools</a></p><h1>Regex Tester</h1><input id="pat" placeholder="Pattern (e.g. \d+)"><input id="flg" placeholder="Flags (g, i, m)" value="g"><textarea id="txt" placeholder="Test string..."></textarea><button onclick="run()">Test</button><div class="out" id="out"></div></div>
<script>
function run(){const p=document.getElementById('pat').value,f=document.getElementById('flg').value,t=document.getElementById('txt').value;const out=document.getElementById('out');try{const re=new RegExp(p,f);const ms=[...t.matchAll(re)];out.innerHTML='Matches: '+ms.length+'<br><br>'+ms.map((m,i)=>(i+1)+': '+JSON.stringify(m[0])+(m.index!=null?' @'+m.index:'')).join('<br>');}catch(e){out.innerHTML='<span class="err">'+e.message+'</span>';}}
</script></body></html>
