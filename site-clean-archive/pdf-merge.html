<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Free online PDF Merge tool. Runs entirely in your browser — no uploads, no sign-up."><title>PDF Merge — TML Tools</title>
<style>body{font-family:-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:#04070C;color:#F4F8FF;margin:0;padding:24px}.wrap{max-width:700px;margin:0 auto}input[type=file]{background:#0b121c;color:#F4F8FF;border:1px solid rgba(255,255,255,.14);border-radius:8px;padding:8px 12px;width:100%}button{background:#37E0FF;color:#04121A;border:none;border-radius:8px;padding:8px 14px;font-weight:700;cursor:pointer;margin:10px 0}a{color:#37E0FF}p{color:#A9BBD4}ul{color:#A9BBD4}</style></head>
<body><div class="wrap"><p><a href="index.html">← Tools</a></p><h1>PDF Merge</h1><p>Select multiple PDFs. Merged in browser, downloaded as merged.pdf.</p><input type="file" id="f" accept="application/pdf" multiple><ul id="l"></ul><button onclick="merge()">Merge & Download</button></div>
<script src="https://cdn.jsdelivr.net/npm/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
<script>
let files=[];
document.getElementById('f').addEventListener('change',e=>{files=[...e.target.files];document.getElementById('l').innerHTML=files.map(f=>'<li>'+f.name+'</li>').join('');});
async function merge(){if(!files.length)return;const merged=await PDFLib.PDFDocument.create();for(const f of files){const b=await f.arrayBuffer();const d=await PDFLib.PDFDocument.load(b);const pages=await merged.copyPages(d,d.getPageIndices());pages.forEach(p=>merged.addPage(p));}const bytes=await merged.save();const blob=new Blob([bytes],{type:'application/pdf'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='merged.pdf';a.click();}
</script></body></html>
