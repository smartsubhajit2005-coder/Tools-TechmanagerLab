<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Free online Image Resizer tool. Runs entirely in your browser — no uploads, no sign-up."><title>Image Resizer — TML Tools</title>
<style>body{font-family:-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:#04070C;color:#F4F8FF;margin:0;padding:24px}.wrap{max-width:700px;margin:0 auto}input[type=file]{background:#0b121c;color:#F4F8FF;border:1px solid rgba(255,255,255,.14);border-radius:8px;padding:8px 12px;width:100%}button{background:#37E0FF;color:#04121A;border:none;border-radius:8px;padding:8px 14px;font-weight:700;cursor:pointer;margin:10px 0}input[type=number]{background:#0b121c;color:#F4F8FF;border:1px solid rgba(255,255,255,.14);border-radius:8px;padding:8px 12px;width:100px}img{max-width:100%;margin-top:12px;border-radius:8px}a{color:#37E0FF}p{color:#A9BBD4}label{margin-right:10px}</style></head>
<body><div class="wrap"><p><a href="index.html">← Tools</a></p><h1>Image Resizer</h1><p>Pick image, set width/height, download.</p><input type="file" id="f" accept="image/*" onchange="load()"><div style="margin:10px 0"><label>Width <input type="number" id="w"></label><label>Height <input type="number" id="h"></label><label><input type="checkbox" id="lock" checked> Keep aspect</label></div><button onclick="run()">Resize & Download</button><img id="preview"></div>
<script>
let img=null;function load(){const f=document.getElementById('f').files[0];if(!f)return;const r=new FileReader();r.onload=e=>{img=new Image();img.onload=()=>{document.getElementById('preview').src=img.src;document.getElementById('w').value=img.width;document.getElementById('h').value=img.height;};img.src=e.target.result;};r.readAsDataURL(f);}
document.getElementById('w').addEventListener('input',()=>{if(!img||!document.getElementById('lock').checked)return;const w=+document.getElementById('w').value;document.getElementById('h').value=Math.round(w*img.height/img.width);});
function run(){if(!img)return;const w=+document.getElementById('w').value,h=+document.getElementById('h').value;const c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(img,0,0,w,h);const a=document.createElement('a');a.href=c.toDataURL('image/png');a.download='resized.png';a.click();}
</script></body></html>
