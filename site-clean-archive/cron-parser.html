<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Free online Cron Parser tool. Runs entirely in your browser — no uploads, no sign-up."><title>Cron Parser — TML Tools</title>
<style>body{font-family:-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:#04070C;color:#F4F8FF;margin:0;padding:24px}.wrap{max-width:700px;margin:0 auto}input{width:100%;background:#0b121c;color:#F4F8FF;border:1px solid rgba(255,255,255,.14);border-radius:8px;padding:10px 12px;font-family:monospace;font-size:14px}button{background:#37E0FF;color:#04121A;border:none;border-radius:8px;padding:8px 14px;font-weight:700;cursor:pointer;margin:10px 0}.out{margin-top:12px;background:#0b121c;border:1px solid rgba(255,255,255,.14);border-radius:12px;padding:14px;font-family:monospace;font-size:13px;line-height:1.7}a{color:#37E0FF}</style></head>
<body><div class="wrap"><p><a href="index.html">← Tools</a></p><h1>Cron Expression Parser</h1><input id="c" value="*/5 * * * *" placeholder="* * * * *"><button onclick="go()">Parse</button><div class="out" id="out"></div></div>
<script>
function go(){const v=document.getElementById('c').value.trim().split(/\s+/);const out=document.getElementById('out');if(v.length!==5){out.textContent='Need 5 fields: minute hour day month weekday';return;}const names=['Minute','Hour','Day of month','Month','Day of week'];out.innerHTML=v.map((f,i)=>'<b>'+names[i]+':</b> '+f).join('<br>');}
</script></body></html>
