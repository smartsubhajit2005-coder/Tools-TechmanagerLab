<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DNS Lookup — TML Tools</title>
<style>body{font-family:-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:#04070C;color:#F4F8FF;margin:0;padding:24px}.wrap{max-width:700px;margin:0 auto}input{width:100%;background:#0b121c;color:#F4F8FF;border:1px solid rgba(255,255,255,.14);border-radius:8px;padding:10px 12px;font-size:14px}button{background:#37E0FF;color:#04121A;border:none;border-radius:8px;padding:8px 14px;font-weight:700;cursor:pointer;margin:10px 0}.out{margin-top:12px;background:#0b121c;border:1px solid rgba(255,255,255,.14);border-radius:12px;padding:14px;font-family:monospace;font-size:13px;line-height:1.7;white-space:pre-wrap}a{color:#37E0FF}</style></head>
<body><div class="wrap"><p><a href="index.html">← Tools</a></p><h1>DNS Lookup</h1><input id="d" placeholder="example.com"><button onclick="run()">Lookup A/AAAA/MX/TXT</button><div class="out" id="out"></div></div>
<script>
async function run(){const d=document.getElementById('d').value.trim();const out=document.getElementById('out');out.textContent='Loading...';let html='';for(const t of ['A','AAAA','MX','TXT','NS','CNAME']){try{const r=await fetch('https://dns.google/resolve?name='+encodeURIComponent(d)+'&type='+t);const j=await r.json();const ans=(j.Answer||[]).map(a=>a.data).join('\n')||'(none)';html+='<b>'+t+':</b>\n'+ans+'\n\n';}catch(e){html+='<b>'+t+':</b> error\n\n';}}out.innerHTML=html.replace(/\n/g,'<br>');}
</script></body></html>
