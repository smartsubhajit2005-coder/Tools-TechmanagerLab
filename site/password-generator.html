<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Password Generator — TML Tools</title>
<style>body{font-family:-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:#04070C;color:#F4F8FF;margin:0;padding:24px}.wrap{max-width:600px;margin:0 auto}input[type=number]{background:#0b121c;color:#F4F8FF;border:1px solid rgba(255,255,255,.14);border-radius:8px;padding:8px 12px;width:80px}button{background:#37E0FF;color:#04121A;border:none;border-radius:8px;padding:8px 14px;font-weight:700;cursor:pointer;margin:6px 6px 6px 0}textarea{width:100%;min-height:120px;background:#0b121c;color:#F4F8FF;border:1px solid rgba(255,255,255,.14);border-radius:12px;padding:14px;font-family:monospace;font-size:13px;margin-top:12px}label{margin-right:14px}a{color:#37E0FF}</style></head>
<body><div class="wrap"><p><a href="index.html">← Tools</a></p><h1>Password Generator</h1><div style="margin:10px 0"><label>Length <input type="number" id="len" value="16" min="4" max="128"></label></div><div style="margin:10px 0"><label><input type="checkbox" id="u" checked> Uppercase</label><label><input type="checkbox" id="l" checked> Lowercase</label><label><input type="checkbox" id="d" checked> Digits</label><label><input type="checkbox" id="s" checked> Symbols</label></div><div style="margin:10px 0"><button onclick="gen(1)">1</button><button onclick="gen(5)">5</button><button onclick="gen(10)">10</button></div><textarea id="out" readonly></textarea></div>
<script>
function gen(n){const L=+document.getElementById('len').value;const sets=[];if(document.getElementById('u').checked)sets.push('ABCDEFGHIJKLMNOPQRSTUVWXYZ');if(document.getElementById('l').checked)sets.push('abcdefghijklmnopqrstuvwxyz');if(document.getElementById('d').checked)sets.push('0123456789');if(document.getElementById('s').checked)sets.push('!@#$%^&*()-_=+[]{};:,.<>?');const pool=sets.join('');const arr=[];for(let k=0;k<n;k++){let p='';for(let i=0;i<L;i++)p+=pool[Math.floor(Math.random()*pool.length)];arr.push(p);}document.getElementById('out').value=arr.join('\n');}
gen(5);
</script></body></html>
