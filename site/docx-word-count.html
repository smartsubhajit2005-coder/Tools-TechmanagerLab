<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DOCX Word Count — TML Tools</title>
<style>body{font-family:-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:#04070C;color:#F4F8FF;margin:0;padding:24px}.wrap{max-width:700px;margin:0 auto}input[type=file]{background:#0b121c;color:#F4F8FF;border:1px solid rgba(255,255,255,.14);border-radius:8px;padding:8px 12px;width:100%}.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin-top:14px}.stat{background:rgba(9,14,22,.6);border:1px solid rgba(255,255,255,.14);border-radius:10px;padding:12px;text-align:center}.stat b{display:block;font-size:22px;color:#37E0FF}.stat span{font-size:11px;color:#A9BBD4;letter-spacing:1.5px}a{color:#37E0FF}p{color:#A9BBD4}</style></head>
<body><div class="wrap"><p><a href="index.html">← Tools</a></p><h1>DOCX Word Count</h1><p>Pick a .docx file. Counted locally, never uploaded.</p><input type="file" id="f" accept=".docx" onchange="go()"><div class="stats" id="s"></div></div>
<script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
<script>
async function go(){const file=document.getElementById('f').files[0];if(!file)return;const buf=await file.arrayBuffer();const zip=await JSZip.loadAsync(buf);const xml=await zip.file('word/document.xml').async('string');const text=xml.replace(/<w:br[^>]*\/>/g,'\n').replace(/<\/w:p>/g,'\n').replace(/<[^>]+>/g,'');const words=text.trim()?text.trim().split(/\s+/).length:0;const chars=text.length;const paras=text.trim()?text.trim().split(/\n/).length:0;document.getElementById('s').innerHTML=`<div class="stat"><b>${words}</b><span>WORDS</span></div><div class="stat"><b>${chars}</b><span>CHARS</span></div><div class="stat"><b>${paras}</b><span>PARAGRAPHS</span></div>`;}
</script></body></html>
