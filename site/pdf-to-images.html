<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PDF to Images — TML Tools</title>
<style>body{font-family:-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:#04070C;color:#F4F8FF;margin:0;padding:24px}.wrap{max-width:720px;margin:0 auto}a{color:#37E0FF;text-decoration:none}h1{font-size:26px;margin:16px 0 6px}p{color:#A9BBD4;font-size:13px;margin:0 0 14px}input[type=file]{background:#0b121c;color:#F4F8FF;border:1px solid rgba(255,255,255,.14);border-radius:8px;padding:8px 12px;width:100%}button{background:#37E0FF;color:#04121A;border:none;border-radius:8px;padding:8px 14px;font-weight:700;cursor:pointer;margin:10px 8px 10px 0}label{color:#A9BBD4;font-size:12px}footer{margin-top:24px;padding-top:14px;border-top:1px solid rgba(255,255,255,.14);font-size:10.5px;letter-spacing:1.7px;color:#6E7F96;display:flex;justify-content:space-between}</style></head>
<body><div class="wrap"><p><a href="index.html">← Tools</a></p>
<h1>PDF to Images</h1>
<p>Extract PDF pages as PNG or JPEG images. Choose a page range and download all pages as a ZIP file. All processing happens locally.</p>
<input type="file" id="f" accept="application/pdf">
<div style="margin:10px 0">
  <label>Format <select id="fmt"><option value="image/jpeg">JPEG</option><option value="image/png">PNG</option></select></label>
  <label style="margin-left:16px">Quality <input type="range" id="q" min="0.1" max="1" step="0.05" value="0.8"></label>
  <label style="margin-left:16px">Scale <select id="scale"><option value="1">1x</option><option value="2" selected>2x</option><option value="3">3x</option></select></label>
  <label style="margin-left:16px">Pages <input id="range" type="text" placeholder="e.g. 1-3,5" style="width:110px"></label>
</div>
<button onclick="run()" id="btn">Convert</button>
<button onclick="dl()" id="dlb" style="display:none">Download ZIP</button>
<p id="info"></p>
<footer><span>TECH MANAGER LAB · PDF</span><span>BUILD BETTER IT</span></footer>
</div>
<script src="https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
<script>
pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.worker.min.js';
let resultBlob=null;
function parseRange(str,total){
  if(!str||!str.trim())return Array.from({length:total},(_,i)=>i+1);
  const set=new Set();
  for(const part of str.split(',')){
    const p=part.trim();if(!p)continue;
    const m=p.match(/^(\d+)-(\d+)$/);
    if(m){for(let i=+m[1];i<=+m[2];i++)if(i>=1&&i<=total)set.add(i);}
    else if(/^\d+$/.test(p)){const n=+p;if(n>=1&&n<=total)set.add(n);}
  }
  return Array.from(set).sort((a,b)=>a-b);
}
async function run(){
  const file=document.getElementById('f').files[0];if(!file)return;
  const fmt=document.getElementById('fmt').value;const q=+document.getElementById('q').value;const scale=+document.getElementById('scale').value;
  document.getElementById('btn').disabled=true;document.getElementById('dlb').style.display='none';
  try{
    const buf=await file.arrayBuffer();
    const pdf=await pdfjsLib.getDocument({data:buf}).promise;
    const pages=parseRange(document.getElementById('range').value,pdf.numPages);
    if(!pages.length){document.getElementById('info').textContent='No valid pages in range (1–'+pdf.numPages+').';document.getElementById('btn').disabled=false;return;}
    const zip=new JSZip();const ext=fmt==='image/png'?'png':'jpg';
    for(const i of pages){
      document.getElementById('info').textContent='Rendering page '+i+' / '+pages.length+'…';
      const page=await pdf.getPage(i);
      const vp=page.getViewport({scale});
      const c=document.createElement('canvas');c.width=vp.width;c.height=vp.height;
      const ctx=c.getContext('2d');
      if(fmt==='image/jpeg'){ctx.fillStyle='#fff';ctx.fillRect(0,0,c.width,c.height);}
      await page.render({canvasContext:ctx,viewport:vp}).promise;
      zip.file('page-'+String(i).padStart(3,'0')+'.'+ext,c.toDataURL(fmt,q));
    }
    resultBlob=await zip.generateAsync({type:'blob'});
    document.getElementById('btn').disabled=false;document.getElementById('dlb').style.display='';
    document.getElementById('info').textContent='Done. '+pages.length+' pages → '+(resultBlob.size/1024).toFixed(1)+' KB ZIP.';
  }catch(e){
    document.getElementById('btn').disabled=false;
    document.getElementById('info').textContent='Error: '+e.message;
  }
}
function dl(){if(!resultBlob)return;const url=URL.createObjectURL(resultBlob);const a=document.createElement('a');a.href=url;a.download='pdf-pages.zip';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),100);}
</script></body></html>
