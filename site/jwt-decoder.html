<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>JWT Decoder — TML Tools</title>
<style>body{font-family:-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:#04070C;color:#F4F8FF;margin:0;padding:24px}.wrap{max-width:900px;margin:0 auto}textarea{width:100%;min-height:100px;background:#0b121c;color:#F4F8FF;border:1px solid rgba(255,255,255,.14);border-radius:12px;padding:14px;font-family:monospace;font-size:13px}pre{background:#0b121c;border:1px solid rgba(255,255,255,.14);border-radius:12px;padding:14px;overflow:auto;min-height:80px}button{background:#37E0FF;color:#04121A;border:none;border-radius:8px;padding:8px 14px;font-weight:700;cursor:pointer;margin:10px 0}a{color:#37E0FF}</style></head>
<body><div class="wrap"><p><a href="index.html">← Tools</a></p><h1>JWT Decoder</h1><textarea id="in" placeholder="Paste JWT..."></textarea><button onclick="dec()">Decode</button><h3>Header</h3><pre id="h"></pre><h3>Payload</h3><pre id="p"></pre></div>
<script>
function b64u(s){s=s.replace(/-/g,'+').replace(/_/g,'/');while(s.length%4)s+='=';return atob(s);}
function dec(){const t=document.getElementById('in').value.trim().split('.');if(t.length<2){document.getElementById('h').textContent='Invalid JWT';return;}try{document.getElementById('h').textContent=JSON.stringify(JSON.parse(b64u(t[0])),null,2);document.getElementById('p').textContent=JSON.stringify(JSON.parse(b64u(t[1])),null,2);}catch(e){document.getElementById('h').textContent='Error: '+e.message;}}
</script></body></html>
