<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Security Header Checker — TML Tools</title>
<style>body{font-family:-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:#04070C;color:#F4F8FF;margin:0;padding:24px}.wrap{max-width:700px;margin:0 auto}input{width:100%;background:#0b121c;color:#F4F8FF;border:1px solid rgba(255,255,255,.14);border-radius:8px;padding:10px 12px;font-size:14px}button{background:#37E0FF;color:#04121A;border:none;border-radius:8px;padding:8px 14px;font-weight:700;cursor:pointer;margin:10px 0}.out{margin-top:12px;background:#0b121c;border:1px solid rgba(255,255,255,.14);border-radius:12px;padding:14px;font-family:monospace;font-size:13px;line-height:1.7;white-space:pre-wrap}a{color:#37E0FF}p{color:#A9BBD4}</style></head>
<body><div class="wrap"><p><a href="index.html">← Tools</a></p><h1>Security Header Checker</h1><p>Fetches headers via CORS (limited). Checks HSTS, CSP, X-Frame-Options, etc.</p><input id="u" placeholder="https://example.com"><button onclick="run()">Check</button><div class="out" id="out"></div></div>
<script>
const checks=['strict-transport-security','content-security-policy','x-frame-options','x-content-type-options','referrer-policy','permissions-policy'];
async function run(){const u=document.getElementById('u').value.trim();const out=document.getElementById('out');out.textContent='Loading...';try{const r=await fetch(u,{method:'HEAD',mode:'cors'});let h='';checks.forEach(c=>{const v=r.headers.get(c);h+=c+': '+(v||'MISSING')+'\n';});out.textContent=h;}catch(e){out.textContent='Error: '+e.message;}}
</script></body></html>
