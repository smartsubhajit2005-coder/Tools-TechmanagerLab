<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Image Format Converter — TML Tools</title>
<style>body{font-family:-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:#04070C;color:#F4F8FF;margin:0;padding:24px}.wrap{max-width:700px;margin:0 auto}input[type=file],select{background:#0b121c;color:#F4F8FF;border:1px solid rgba(255,255,255,.14);border-radius:8px;padding:8px 12px;width:100%}button{background:#37E0FF;color:#04121A;border:none;border-radius:8px;padding:8px 14px;font-weight:700;cursor:pointer;margin:10px 0}img{max-width:100%;margin-top:12px;border-radius:8px}a{color:#37E0FF}p{color:#A9BBD4}</style></head>
<body><div class="wrap"><p><a href="index.html">← Tools</a></p><h1>Image Format Converter</h1><p>Pick image, choose output format, download.</p><input type="file" id="f" accept="image/*" onchange="load()"><select id="fmt" style="margin-top:8px"><option value="image/png">PNG</option><option value="image/jpeg">JPEG</option><option value="image/webp">WebP</option></select><button onclick="run()">Convert & Download</button><img id="preview"></div>
<script>
let img=null;function load(){const f=document.getElementById('f').files[0];if(!f)return;const r=new FileReader();r.onload=e=>{img=new Image();img.onload=()=>document.getElementById('preview').src=img.src;img.src=e.target.result;};r.readAsDataURL(f);}
function run(){if(!img)return;const c=document.createElement('canvas');c.width=img.width;c.height=img.height;c.getContext('2d').drawImage(img,0,0);const fmt=document.getElementById('fmt').value;const ext=fmt.split('/')[1];const a=document.createElement('a');a.href=c.toDataURL(fmt,0.92);a.download='converted.'+ext;a.click();}
</script></body></html>
