<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Hash Generator — TML Tools</title>
<style>body{font-family:-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:#04070C;color:#F4F8FF;margin:0;padding:24px}.wrap{max-width:800px;margin:0 auto}textarea{width:100%;min-height:120px;background:#0b121c;color:#F4F8FF;border:1px solid rgba(255,255,255,.14);border-radius:12px;padding:14px;font-family:monospace;font-size:13px}button{background:#37E0FF;color:#04121A;border:none;border-radius:8px;padding:8px 14px;font-weight:700;cursor:pointer;margin-right:6px}a{color:#37E0FF}.out{margin-top:12px;font-family:monospace;font-size:12px;word-break:break-all;background:#0b121c;padding:10px;border-radius:8px}</style></head>
<body><div class="wrap"><p><a href="index.html">← Tools</a></p><h1>Hash Generator</h1><textarea id="in" placeholder="Input text..."></textarea><div style="margin:10px 0"><button onclick="run('SHA-1')">SHA-1</button><button onclick="run('SHA-256')">SHA-256</button><button onclick="run('SHA-384')">SHA-384</button><button onclick="run('SHA-512')">SHA-512</button></div><div class="out" id="out">—</div></div>
<script>
async function run(algo){const data=new TextEncoder().encode(document.getElementById('in').value);const buf=await crypto.subtle.digest(algo,data);const arr=Array.from(new Uint8Array(buf));document.getElementById('out').textContent=arr.map(b=>b.toString(16).padStart(2,'0')).join('');}
</script></body></html>
