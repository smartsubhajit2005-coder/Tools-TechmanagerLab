<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Color Converter — TML Tools</title>
<style>body{font-family:-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:#04070C;color:#F4F8FF;margin:0;padding:24px}.wrap{max-width:600px;margin:0 auto}input{background:#0b121c;color:#F4F8FF;border:1px solid rgba(255,255,255,.14);border-radius:8px;padding:8px 12px;font-size:14px;width:100%}button{background:#37E0FF;color:#04121A;border:none;border-radius:8px;padding:8px 14px;font-weight:700;cursor:pointer;margin:10px 0}.swatch{width:100%;height:60px;border-radius:10px;margin:12px 0;border:1px solid rgba(255,255,255,.14)}.out{font-family:monospace;font-size:13px;line-height:1.7;background:#0b121c;padding:12px;border-radius:8px}a{color:#37E0FF}</style></head>
<body><div class="wrap"><p><a href="index.html">← Tools</a></p><h1>Color Converter</h1><input id="c" value="#37E0FF" oninput="go()"><div class="swatch" id="sw"></div><div class="out" id="out"></div></div>
<script>
function hex2rgb(h){h=h.replace('#','');if(h.length===3)h=h.split('').map(x=>x+x).join('');const n=parseInt(h,16);return [(n>>16)&255,(n>>8)&255,n&255];}
function rgb2hsl(r,g,b){r/=255;g/=255;b/=255;const max=Math.max(r,g,b),min=Math.min(r,g,b);let h,s,l=(max+min)/2;if(max===min){h=s=0;}else{const d=max-min;s=l>.5?d/(2-max-min):d/(max+min);switch(max){case r:h=(g-b)/d+(g<b?6:0);break;case g:h=(b-r)/d+2;break;case b:h=(r-g)/d+4;break;}h/=6;}return [Math.round(h*360),Math.round(s*100),Math.round(l*100)];}
function go(){const v=document.getElementById('c').value;let r,g,b;if(/^#?[0-9a-fA-F]{3,6}$/.test(v)){[r,g,b]=hex2rgb(v);}else if(/^rgb/i.test(v)){const m=v.match(/\d+/g);[r,g,b]=m.map(Number);}else{return;}document.getElementById('sw').style.background=`rgb(${r},${g},${b})`;const hsl=rgb2hsl(r,g,b);document.getElementById('out').innerHTML='HEX: #'+[r,g,b].map(x=>x.toString(16).padStart(2,'0')).join('').toUpperCase()+'<br>RGB: rgb('+r+', '+g+', '+b+')<br>HSL: hsl('+hsl[0]+', '+hsl[1]+'%, '+hsl[2]+'%)';}
go();
</script></body></html>
