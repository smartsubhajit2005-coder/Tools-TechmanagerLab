<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Currency Converter — TML Tools</title>
<style>body{font-family:-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:#04070C;color:#F4F8FF;margin:0;padding:24px}.wrap{max-width:640px;margin:0 auto}a{color:#37E0FF;text-decoration:none}h1{font-size:26px;margin:16px 0 6px}p{color:#A9BBD4;font-size:13px;margin:0 0 14px}label{display:block;font-size:12px;color:#A9BBD4;margin:10px 0 4px}input,select{background:#0b121c;color:#F4F8FF;border:1px solid rgba(255,255,255,.14);border-radius:8px;padding:8px 12px;width:100%;box-sizing:border-box}button{background:#37E0FF;color:#04121A;border:none;border-radius:8px;padding:10px 16px;font-weight:700;cursor:pointer;margin-top:14px;margin-right:8px}.box{margin-top:18px;padding:16px;border-radius:12px;border:1px solid rgba(55,224,255,.34);background:rgba(55,224,255,.06)}b{color:#37E0FF}small{color:#7E90AA;font-size:11px}footer{margin-top:24px;padding-top:14px;border-top:1px solid rgba(255,255,255,.14);font-size:10.5px;letter-spacing:1.7px;color:#6E7F96;display:flex;justify-content:space-between}</style></head>
<body><div class="wrap">
<p><a href="index.html">← Home</a></p>
<h1>Currency Converter</h1>
<p>Approximate rates (1 USD = X). Hardcoded — not live. For reference only.</p>
<label>Amount</label><input id="amt" type="number" value="100" oninput="convert()">
<label>From</label><select id="from" onchange="convert()"></select>
<label>To</label><select id="to" onchange="convert()"></select>
<div class="box" id="out"></div>
<small>Rates are indicative and may be stale. Verify with your bank before transacting.</small>
<footer><span>TECH MANAGER LAB · CURRENCY</span><span>BUILD BETTER IT</span></footer>
</div>
<script>
const R={
USD:1,EUR:0.92,GBP:0.79,INR:83.5,JPY:150.2,CNY:7.25,AUD:1.52,CAD:1.36,CHF:0.88,SGD:1.35,AED:3.67,SAR:3.75,PKR:278,BDT:110,LKR:305,NPR:133,THB:35.5,KRW:1330,MYR:4.72,IDR:15600,PHP:56.5,VND:24500,RUB:92,BRL:5.0,MXN:17.2,ZAR:18.5,NZD:1.65,HKD:7.82,SEK:10.6,NOK:10.8,DKK:6.9,PLN:4.0,TRY:32.5,ILS:3.7,EGP:48.5,KWD:0.307,QAR:3.64,OMR:0.385,BHD:0.376,JOD:0.709,MAD:10.1,NGN:1580,KES:132,GHS:15.2,UGX:3750,TZS:2550,ETB:56.5,XOF:605,XAF:605
};
const from=document.getElementById('from');const to=document.getElementById('to');
Object.keys(R).sort().forEach(c=>{from.add(new Option(c,c));to.add(new Option(c,c));});
from.value='USD';to.value='INR';
function convert(){
  const amt=+document.getElementById('amt').value;const f=from.value;const t=to.value;
  const res=amt*(R[t]/R[f]);
  document.getElementById('out').innerHTML='<b>'+amt.toLocaleString()+' '+f+'</b> = <b>'+res.toLocaleString('en-IN',{maximumFractionDigits:2})+' '+t+'</b><br><small>1 '+f+' = '+(R[t]/R[f]).toFixed(4)+' '+t+'</small>';
}
convert();
</script>
</body></html>
