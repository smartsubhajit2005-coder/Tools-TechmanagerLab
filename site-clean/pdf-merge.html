<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="Free online PDF Merge tool. Combine multiple PDFs into one — entirely in your browser, no uploads.">
  <link rel="canonical" href="https://techmanagerlab.com/tools/pdf-merge.html">
<title>PDF Merge — TML Tools</title>
    <link rel="icon" type="image/png" href="../logo.png">
<style>body{font-family:-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:#04070C;color:#F4F8FF;margin:0;padding:24px}.wrap{max-width:700px;margin:0 auto}input[type=file]{background:#0b121c;color:#F4F8FF;border:1px solid rgba(255,255,255,.14);border-radius:8px;padding:8px 12px;width:100%}button{background:#37E0FF;color:#04121A;border:none;border-radius:8px;padding:8px 14px;font-weight:700;cursor:pointer;margin:10px 0}a{color:#37E0FF}p{color:#A9BBD4}ul{color:#A9BBD4}.tml-privacy{margin-top:18px;padding:12px 14px;border:1px solid rgba(255,255,255,.14);border-radius:10px;font-size:12px;color:#A9BBD4;line-height:1.5}.tml-error{color:#ff8a8a;font-size:13px;margin-top:10px}</style></head>
<body><div class="wrap"><p><a href="index.html">← Tools</a></p><h1>PDF Merge</h1><p>Select multiple PDFs. Merged in browser, downloaded as merged.pdf.</p>
<div id="priv"></div>
<input type="file" id="f" accept="application/pdf" multiple><div id="msg"></div><ul id="l"></ul><button onclick="merge()">Merge & Download</button></div>
<script src="https://cdn.jsdelivr.net/npm/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
<script type="module">
import { validateFile } from './shared/file-handling.js';
import { showError, clearMessage } from './shared/errors.js';
import { renderPrivacyBanner } from './shared/privacy.js';
renderPrivacyBanner(document.getElementById('priv'),'pdf-merge','local-file');
let files=[];
document.getElementById('f').addEventListener('change',e=>{
  files=[...e.target.files];
  const msg=document.getElementById('msg');
  const bad=files.filter(f=>!validateFile(f,{maxSize:50*1024*1024,allowedTypes:['application/pdf']}).valid);
  if(bad.length){showError(msg,bad[0].name+' is not a valid PDF or exceeds the size limit.');}
  else clearMessage(msg);
  document.getElementById('l').innerHTML=files.map(f=>'<li>'+f.name+'</li>').join('');
});
async function merge(){
  const msg=document.getElementById('msg');
  if(!files.length){showError(msg,'Select at least one PDF.');return;}
  for(const f of files){const c=validateFile(f,{maxSize:50*1024*1024,allowedTypes:['application/pdf']});if(!c.valid){showError(msg,c.error);return;}}
  clearMessage(msg);
  try{
    const merged=await PDFLib.PDFDocument.create();
    for(const f of files){
      const b=await f.arrayBuffer();
      const d=await PDFLib.PDFDocument.load(b);
      const pages=await merged.copyPages(d,d.getPageIndices());
      pages.forEach(p=>merged.addPage(p));
    }
    const bytes=await merged.save();
    const blob=new Blob([bytes],{type:'application/pdf'});
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a');
    a.href=url;a.download='merged.pdf';
    document.body.appendChild(a);a.click();a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),1000);
  }catch(e){showError(msg,'Merge failed: '+e.message);}
}
</script></body></html>
