<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="Free online Password Strength tool. Score entropy and get feedback — entirely in your browser, no uploads, no sign-up.">
  <link rel="canonical" href="https://techmanagerlab.com/tools/password-strength.html">
<title>Password Strength — TML Tools</title>
    <link rel="icon" type="image/png" href="../logo.png">
<style>body{font-family:-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:#04070C;color:#F4F8FF;margin:0;padding:24px}.wrap{max-width:600px;margin:0 auto}input{width:100%;background:#0b121c;color:#F4F8FF;border:1px solid rgba(255,255,255,.14);border-radius:8px;padding:10px 12px;font-size:14px} .bar{height:8px;background:#1a2433;border-radius:4px;margin:12px 0;overflow:hidden}.fill{height:100%;width:0%;transition:.3s}.lbl{font-weight:700}a{color:#37E0FF}.tml-privacy{margin-top:18px;padding:12px 14px;border:1px solid rgba(255,255,255,.14);border-radius:10px;font-size:12px;color:#A9BBD4;line-height:1.5}.tml-error{color:#ff8a8a;font-size:13px;margin-top:10px}</style></head>
<body><div class="wrap"><p><a href="index.html">← Tools</a></p><h1>Password Strength</h1><div id="priv"></div><input id="p" type="text" placeholder="Type a password..." oninput="chk()"><div class="bar"><div class="fill" id="f"></div></div><p class="lbl" id="l">—</p><ul id="tips"></ul></div>
<script type="module">
import { renderPrivacyBanner } from './shared/privacy.js';
renderPrivacyBanner(document.getElementById('priv'),'password-strength','local');
function chk(){const v=document.getElementById('p').value;let s=0;const tips=[];if(v.length>=8)s+=1;else tips.push('At least 8 characters');if(v.length>=12)s+=1;if(/[a-z]/.test(v)&&/[A-Z]/.test(v))s+=1;else tips.push('Mix upper & lower case');if(/\d/.test(v))s+=1;else tips.push('Add a number');if(/[^A-Za-z0-9]/.test(v))s+=1;else tips.push('Add a symbol');const pct=[0,20,40,60,80,100][s];const colors=['#ff6b6b','#ff9f43','#feca57','#48dbfb','#1dd1a1','#1dd1a1'];document.getElementById('f').style.width=pct+'%';document.getElementById('f').style.background=colors[s];const labels=['Very weak','Weak','Fair','Good','Strong','Very strong'];document.getElementById('l').textContent=labels[s]+' ('+pct+'%)';document.getElementById('tips').innerHTML=tips.map(t=>'<li>'+t+'</li>').join('');}
</script></body></html>
