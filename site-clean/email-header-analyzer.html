<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Free online Email Header Analyzer tool. Runs entirely in your browser — no uploads, no sign-up."><title>Email Header Analyzer — TML Tools</title>
<style>body{font-family:-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:#04070C;color:#F4F8FF;margin:0;padding:24px}.wrap{max-width:900px;margin:0 auto}textarea{width:100%;min-height:200px;background:#0b121c;color:#F4F8FF;border:1px solid rgba(255,255,255,.14);border-radius:12px;padding:14px;font-family:monospace;font-size:12px}button{background:#37E0FF;color:#04121A;border:none;border-radius:8px;padding:8px 14px;font-weight:700;cursor:pointer;margin:10px 0}.out{margin-top:12px;background:#0b121c;border:1px solid rgba(255,255,255,.14);border-radius:12px;padding:14px;font-family:monospace;font-size:13px;line-height:1.7;white-space:pre-wrap}a{color:#37E0FF}</style></head>
<body><div class="wrap"><p><a href="index.html">← Tools</a></p><h1>Email Header Analyzer</h1><textarea id="h" placeholder="Paste full email headers..."></textarea><button onclick="run()">Analyze</button><div class="out" id="out"></div></div>
<script>
function run(){const raw=document.getElementById('h').value;const lines=raw.split(/\r?\n/);const hdrs={};let cur='';lines.forEach(l=>{if(/^\s/.test(l)&&cur){hdrs[cur]+=l.trim();}else{const m=l.match(/^([^:]+):\s*(.*)$/);if(m){cur=m[1];hdrs[cur]=m[2];}}});let o='';['From','To','Subject','Date','Message-ID','Return-Path','Reply-To','Received-SPF','Authentication-Results','DKIM-Signature'].forEach(k=>{if(hdrs[k])o+=k+': '+hdrs[k]+'\n';});o+='\n--- All headers ---\n'+Object.keys(hdrs).map(k=>k+': '+hdrs[k]).join('\n');document.getElementById('out').textContent=o;}
</script></body></html>
