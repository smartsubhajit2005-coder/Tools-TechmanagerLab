<body><div class="wrap"><p><a href="index.html">← Tools</a></p><h1>UUID Generator</h1><div style="margin:10px 0"><button onclick="gen(1)">1</button><button onclick="gen(5)">5</button><button onclick="gen(10)">10</button></div><textarea id="out" readonly></textarea></div>
