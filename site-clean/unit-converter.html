<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Free online Unit Converter tool. Runs entirely in your browser — no uploads, no sign-up."><title>Unit Converter — TML Tools</title>
<style>body{font-family:-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:#04070C;color:#F4F8FF;margin:0;padding:24px}.wrap{max-width:640px;margin:0 auto}a{color:#37E0FF;text-decoration:none}h1{font-size:26px;margin:16px 0 6px}p{color:#A9BBD4;font-size:13px;margin:0 0 14px}label{display:block;font-size:12px;color:#A9BBD4;margin:10px 0 4px}input,select{background:#0b121c;color:#F4F8FF;border:1px solid rgba(255,255,255,.14);border-radius:8px;padding:8px 12px;width:100%;box-sizing:border-box}button{background:#37E0FF;color:#04121A;border:none;border-radius:8px;padding:10px 16px;font-weight:700;cursor:pointer;margin-top:14px}.box{margin-top:18px;padding:16px;border-radius:12px;border:1px solid rgba(55,224,255,.34);background:rgba(55,224,255,.06)}b{color:#37E0FF}footer{margin-top:24px;padding-top:14px;border-top:1px solid rgba(255,255,255,.14);font-size:10.5px;letter-spacing:1.7px;color:#6E7F96;display:flex;justify-content:space-between}</style></head>
<body><div class="wrap">
<p><a href="index.html">← Home</a></p>
<h1>Unit Converter</h1>
<p>Length, weight, temperature, volume, area, speed, field measurements (bigha, guntha, marla, kanal). All in your browser.</p>
<label>Category</label><select id="cat" onchange="build()"></select>
<label>From</label><select id="from"></select>
<label>To</label><select id="to"></select>
<label>Value</label><input id="val" type="number" value="1" oninput="convert()">
<div class="box" id="out"></div>
<footer><span>TECH MANAGER LAB · UNITS</span><span>BUILD BETTER IT</span></footer>
</div>
<script>
const U={
 length:{units:['millimeter','centimeter','meter','kilometer','inch','foot','yard','mile'],f:{millimeter:0.001,centimeter:0.01,meter:1,kilometer:1000,inch:0.0254,foot:0.3048,yard:0.9144,mile:1609.344}},
 weight:{units:['milligram','gram','kilogram','tonne','ounce','pound'],f:{milligram:0.000001,gram:0.001,kilogram:1,tonne:1000,ounce:0.0283495,pound:0.453592}},
 volume:{units:['milliliter','liter','cubic meter','gallon (US)','quart (US)','pint (US)','fluid ounce (US)','cup (US)'],f:{milliliter:0.001,liter:1,'cubic meter':1000,'gallon (US)':3.78541,'quart (US)':0.946353,'pint (US)':0.473176,'fluid ounce (US)':0.0295735,'cup (US)':0.236588}},
 area:{units:['sq millimeter','sq centimeter','sq meter','sq kilometer','sq inch','sq foot','sq yard','acre','hectare'],f:{'sq millimeter':0.000001,'sq centimeter':0.0001,'sq meter':1,'sq kilometer':1000000,'sq inch':0.00064516,'sq foot':0.092903,'sq yard':0.836127,acre:4046.86,hectare:10000}},
 speed:{units:['m/s','km/h','mph','knot','ft/s'],f:{'m/s':1,'km/h':0.277778,mph:0.44704,knot:0.514444,'ft/s':0.3048}},
 field:{units:['sq foot','sq meter','sq yard','acre','hectare','bigha (UP)','bigha (Bihar)','guntha','katha (Bihar)','marla','kanal'],f:{'sq foot':0.092903,'sq meter':1,'sq yard':0.836127,acre:4046.86,hectare:10000,'bigha (UP)':2795.0,'bigha (Bihar)':6772.0,guntha:101.17,marla:25.293,'katha (Bihar)':126.48,'kanal':505.856}}
};
const cat=document.getElementById('cat');Object.keys(U).forEach(k=>cat.add(new Option(k.charAt(0).toUpperCase()+k.slice(1),k)));cat.add(new Option('Temperature','temp'));
function build(){
  const c=cat.value;const from=document.getElementById('from');const to=document.getElementById('to');from.innerHTML='';to.innerHTML='';
  if(c==='temp'){['Celsius','Fahrenheit','Kelvin'].forEach(u=>{from.add(new Option(u,u));to.add(new Option(u,u));});from.value='Celsius';to.value='Fahrenheit';}
  else{U[c].units.forEach(u=>{from.add(new Option(u,u));to.add(new Option(u,u));});from.value=U[c].units[0];to.value=U[c].units[1];}
  convert();
}
function convert(){
  const c=cat.value;const v=+document.getElementById('val').value;const f=document.getElementById('from').value;const t=document.getElementById('to').value;
  let res;
  if(c==='temp'){
    let celsius;
    if(f==='Celsius')celsius=v;else if(f==='Fahrenheit')celsius=(v-32)*5/9;else celsius=v-273.15;
    if(t==='Celsius')res=celsius;else if(t==='Fahrenheit')res=celsius*9/5+32;else res=celsius+273.15;
  } else {
    res=v*U[c].f[f]/U[c].f[t];
  }
  document.getElementById('out').innerHTML='<b>'+v+' '+f+'</b> = <b>'+res.toLocaleString('en-IN',{maximumFractionDigits:6})+' '+t+'</b>';
}
build();
document.getElementById('from').addEventListener('change',convert);document.getElementById('to').addEventListener('change',convert);
</script>
</body></html>
