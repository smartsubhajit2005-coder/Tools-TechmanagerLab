<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="TechManagerLab - Loan / EMI Calculator —  Tools. Free IT tools for developers, sysadmins, and IT managers.">
  <link rel="canonical" href="https://techmanagerlab.com/tools/loan-calculator.html">
<title>Loan / EMI Calculator — TML Tools</title>
    <link rel="icon" type="image/png" href="../logo.png">
<style>body{font-family:-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:#04070C;color:#F4F8FF;margin:0;padding:24px}.wrap{max-width:640px;margin:0 auto}a{color:#37E0FF;text-decoration:none}h1{font-size:26px;margin:16px 0 6px}p{color:#A9BBD4;font-size:13px;margin:0 0 14px}label{display:block;font-size:12px;color:#A9BBD4;margin:10px 0 4px}input,select{background:#0b121c;color:#F4F8FF;border:1px solid rgba(255,255,255,.14);border-radius:8px;padding:8px 12px;width:100%;box-sizing:border-box}button{background:#37E0FF;color:#04121A;border:none;border-radius:8px;padding:10px 16px;font-weight:700;cursor:pointer;margin-top:14px}.box{margin-top:18px;padding:16px;border-radius:12px;border:1px solid rgba(55,224,255,.34);background:rgba(55,224,255,.06)}b{color:#37E0FF}footer{margin-top:24px;padding-top:14px;border-top:1px solid rgba(255,255,255,.14);font-size:10.5px;letter-spacing:1.7px;color:#6E7F96;display:flex;justify-content:space-between}</style></head>
<body><div class="wrap">
<p><a href="index.html">← Home</a></p>
<h1>Loan / EMI Calculator</h1>
<p>Enter principal, rate, tenure. Get EMI, total interest, total payable.</p>
<label>Principal (₹)</label><input id="p" type="number" value="500000">
<label>Annual interest rate (%)</label><input id="r" type="number" value="10" step="0.1">
<label>Tenure (months)</label><input id="n" type="number" value="60">
<button onclick="calc()">Calculate</button>
<div class="box" id="out"></div>
<footer><span>TECH MANAGER LAB · LOAN</span><span>BUILD BETTER IT</span></footer>
</div>
<script>
function calc(){
  const P=+document.getElementById('p').value;const r=+document.getElementById('r').value/100/12;const n=+document.getElementById('n').value;
  const emi = r===0 ? P/n : P*r*Math.pow(1+r,n)/(Math.pow(1+r,n)-1);
  const total=emi*n;const interest=total-P;
  document.getElementById('out').innerHTML='<b>EMI:</b> ₹'+Math.round(emi).toLocaleString('en-IN')+'/month<br><b>Total interest:</b> ₹'+Math.round(interest).toLocaleString('en-IN')+'<br><b>Total payable:</b> ₹'+Math.round(total).toLocaleString('en-IN')+'<br><b>Interest % of principal:</b> '+(interest/P*100).toFixed(1)+'%';
}
calc();
</script>
</body></html>
