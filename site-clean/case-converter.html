<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="TechManagerLab - Case Converter —  Tools. Practical IT management tools, guides, and resources.">
  <link rel="canonical" href="https://techmanagerlab.com/tools/case-converter.html">
<title>Case Converter — TML Tools</title>
    <link rel="icon" type="image/png" href="../logo.png">
<style>body{font-family:-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:#04070C;color:#F4F8FF;margin:0;padding:24px}.wrap{max-width:800px;margin:0 auto}textarea{width:100%;min-height:140px;background:#0b121c;color:#F4F8FF;border:1px solid rgba(255,255,255,.14);border-radius:12px;padding:14px;font-size:14px}button{background:#37E0FF;color:#04121A;border:none;border-radius:8px;padding:8px 14px;font-weight:700;cursor:pointer;margin:4px 4px 4px 0}a{color:#37E0FF}</style></head>
<body><div class="wrap"><p><a href="index.html">← Tools</a></p><h1>Case Converter</h1><textarea id="in" placeholder="Type text..."></textarea><div style="margin:10px 0"><button onclick="c('upper')">UPPER</button><button onclick="c('lower')">lower</button><button onclick="c('title')">Title Case</button><button onclick="c('sentence')">Sentence case</button><button onclick="c('camel')">camelCase</button><button onclick="c('snake')">snake_case</button><button onclick="c('kebab')">kebab-case</button></div><textarea id="out" placeholder="Result..." readonly></textarea></div>
<script>
const i=document.getElementById('in'),o=document.getElementById('out');
function c(m){const v=i.value;let r=v;if(m==='upper')r=v.toUpperCase();else if(m==='lower')r=v.toLowerCase();else if(m==='title')r=v.replace(/\w\S*/g,w=>w.charAt(0).toUpperCase()+w.slice(1).toLowerCase());else if(m==='sentence')r=v.charAt(0).toUpperCase()+v.slice(1).toLowerCase();else if(m==='camel'){r=v.toLowerCase().replace(/[^a-zA-Z0-9]+(.)/g,(_,ch)=>ch.toUpperCase());}else if(m==='snake')r=v.toLowerCase().replace(/\s+/g,'_').replace(/[^a-z0-9_]/g,'');else if(m==='kebab')r=v.toLowerCase().replace(/\s+/g,'-').replace(/[^a-z0-9-]/g,'');o.value=r;}
</script></body></html>
