<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Free online PDF Split tool. Runs entirely in your browser — no uploads, no sign-up."><title>PDF Split — TML Tools</title>
<style>body{font-family:-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:#04070C;color:#F4F8FF;margin:0;padding:24px}.wrap{max-width:700px;margin:0 auto}input[type=file],input[type=text]{background:#0b121c;color:#F4F8FF;border:1px solid rgba(255,255,255,.14);border-radius:8px;padding:8px 12px;width:100%}button{background:#37E0FF;color:#04121A;border:none;border-radius:8px;padding:8px 14px;font-weight:700;cursor:pointer;margin:10px 0}a{color:#37E0FF}p{color:#A9BBD4}</style></head>
<body><div class="wrap"><p><a href="index.html">← Tools</a></p><h1>PDF Split</h1><p>Pick a PDF and page range (e.g. 1-3,5). Downloads split.pdf.</p><input type="file" id="f" accept="application/pdf"><input type="text" id="r" placeholder="1-3,5" style="margin-top:8px"><button onclick="split()">Split & Download</button></div>
<script src="https://cdn.jsdelivr.net/npm/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
<script>
async function split(){const file=document.getElementById('f').files[0];if(!file)return;const b=await file.arrayBuffer();const src=await PDFLib.PDFDocument.load(b);const total=src.getPageCount();const rng=document.getElementById('r').value.trim();let pages=[];if(!rng){pages=[...Array(total).keys()];}else{rng.split(',').forEach(tok=>{const t=tok.trim();if(t.includes('-')){const [a,bb]=t.split('-').map(x=>+x);for(let i=a;i<=bb;i++)pages.push(i-1);}else pages.push(+t-1);});}const out=await PDFLib.PDFDocument.create();const copied=await out.copyPages(src,pages);copied.forEach(p=>out.addPage(p));const bytes=await out.save();const blob=new Blob([bytes],{type:'application/pdf'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='split.pdf';a.click();}
</script></body></html>
