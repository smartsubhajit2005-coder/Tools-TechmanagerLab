<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tech Manager Lab — Run IT like a business</title>
  <meta name="description" content="Tech Manager Lab — audits, tools and playbooks for SMB IT managers. India-first.">
  <link rel="stylesheet" href="transitions.css">
  <style>
    :root {
      --navy: #02143F;
      --panel: #013091;
      --cyan: #2EE6FF;
      --amber: #F5A623;
      --body: #CFEBFF;
      --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--navy);
      color: var(--body);
      font-family: var(--font);
      line-height: 1.5;
    }
    a { color: var(--cyan); }
    .skip {
      position: absolute;
      left: -9999px;
      top: 0;
      background: var(--cyan);
      color: var(--navy);
      padding: 8px 14px;
      font-weight: 700;
      z-index: 100;
    }
    .skip:focus { left: 0; }
    :focus-visible {
      outline: 3px solid var(--cyan);
      outline-offset: 2px;
    }
    header.topbar {
      position: sticky;
      top: 0;
      z-index: 50;
      display: flex;
      align-items: center;
      gap: 24px;
      padding: 14px 24px;
      background: rgba(2, 20, 63, .95);
      border-bottom: 1px solid rgba(46, 230, 255, .25);
      backdrop-filter: blur(6px);
    }
    .wordmark {
      color: var(--cyan);
      font-weight: 800;
      letter-spacing: .08em;
      text-decoration: none;
    }
    header.topbar nav { margin-left: auto; display: flex; gap: 18px; }
    header.topbar nav a { color: var(--body); text-decoration: none; font-weight: 600; }
    header.topbar nav a:hover { color: var(--cyan); }
    main { max-width: 1080px; margin: 0 auto; padding: 24px; }
    footer#footer {
      max-width: 1080px;
      margin: 0 auto;
      padding: 24px;
      border-top: 1px solid rgba(46, 230, 255, .25);
    }
  </style>
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>
  <header class="topbar">
    <a class="wordmark" href="/">TECH MANAGER LAB</a>
    <nav aria-label="Main">
      <a href="/">Home</a>
      <a href="#hubs">Hubs</a>
      <a href="https://techmanagerlab.com/tools/tier1-license-cleanup/">Tools</a>
    </nav>
  </header>
  <main id="main">
    <section id="latest" aria-label="Latest video"></section>
    <section id="bento" aria-label="Highlights"></section>
    <section id="stats" aria-label="Stats"></section>
    <section id="hubs" aria-label="Topic hubs"></section>
  </main>
  <footer id="footer"></footer>
</body>
</html>
