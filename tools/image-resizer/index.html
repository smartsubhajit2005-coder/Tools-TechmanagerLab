<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="TechManagerLab - Image Resizer - Tools. Practical IT management tools, guides, and resources.">
  <link rel="canonical" href="https://techmanagerlab.com/tools/image-resizer.html">
<title>Image Resizer - TML Tools</title>
    <link rel="icon" type="image/png" href="../logo.png">
<style>body{font-family:-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:#04070C;color:#F4F8FF;margin:0;padding:24px}.wrap{max-width:760px;margin:0 auto}input[type=file]{background:#0b121c;color:#F4F8FF;border:1px solid rgba(255,255,255,.14);border-radius:8px;padding:8px 12px;width:100%}button{background:#37E0FF;color:#04121A;border:none;border-radius:8px;padding:8px 14px;font-weight:700;cursor:pointer;margin:10px 0}input[type=number]{background:#0b121c;color:#F4F8FF;border:1px solid rgba(255,255,255,.14);border-radius:8px;padding:8px 12px;width:100px}img{max-width:100%;margin-top:12px;border-radius:8px}a{color:#37E0FF}p{color:#A9BBD4}label{margin-right:10px;display:block;margin-top:8px}input[type=range]{width:100%}</style></head>
<body><div class="wrap"><p><a href="../../tools/">← Tools</a></p><h1>Image Resizer</h1><p>Set dimensions and target file size, then download.</p><input type="file" id="f" accept="image/*" onchange="load()"><div style="margin:10px 0"><label>Width <input type="number" id="w"></label><label>Height <input type="number" id="h"></label><label><input type="checkbox" id="lock" checked> Keep aspect</label></div><div style="margin:10px 0"><label>Target size (KB): <span id="kbv">200</span> KB</label><input type="range" id="kb" min="10" max="2000" value="200" oninput="document.getElementById('kbv').textContent=this.value"></div><div style="margin:10px 0"><label>Format <select id="fmt"><option value="image/jpeg">JPEG</option><option value="image/png">PNG</option></select></label></div><button onclick="run()">Resize &amp; Download</button><div id="info" style="color:#A9BBD4;margin:8px 0"></div><img id="preview"></div>
<script>
let img=null;function load(){const f=document.getElementById('f').files[0];if(!f)return;const r=new FileReader();r.onload=e=>{img=new Image();img.onload=()=>{document.getElementById('preview').src=img.src;document.getElementById('w').value=img.width;document.getElementById('h').value=img.height;document.getElementById('info').textContent='Original: '+img.width+'x'+img.height+' - '+(f.size/1024).toFixed(1)+' KB';};img.src=e.target.result;};r.readAsDataURL(f);}
document.getElementById('w').addEventListener('input',()=>{if(!img||!document.getElementById('lock').checked)return;const w=+document.getElementById('w').value;document.getElementById('h').value=Math.round(w*img.height/img.width);});
async function toBlob(canvas,q,fmt){return new Promise(res=>canvas.toBlob(b=>res(b),fmt,q));}
async function run(){if(!img)return;const w=+document.getElementById('w').value,h=+document.getElementById('h').value,fmt=document.getElementById('fmt').value,targetKB=+document.getElementById('kb').value;const c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(img,0,0,w,h);const info=document.getElementById('info');if(fmt==='image/png'){const a=document.createElement('a');a.href=c.toDataURL('image/png');a.download='resized.png';a.click();info.textContent='PNG downloaded (size not targetable).';return;}
let lo=0.05,hi=0.95,best=hi;for(let i=0;i<12;i++){const mid=(lo+hi)/2;const blob=await toBlob(c,mid,fmt);const kb=blob.size/1024;if(kb<=targetKB){best=mid;lo=mid;}else{hi=mid;}}const blob=await toBlob(c,best,fmt);const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='resized.jpg';a.click();info.textContent='Result: '+(blob.size/1024).toFixed(1)+' KB (target '+targetKB+' KB).';}
</script></body></html>
